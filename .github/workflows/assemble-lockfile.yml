name: assemble-lockfile
on:
  push:
    paths:
      - '.lock-import/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble pnpm-lock.yaml
        run: |
          set -euo pipefail
          # Wait until all expected chunks are present
          COUNT=$(ls .lock-import/*.b64 2>/dev/null | wc -l)
          echo "chunk count=$COUNT"
          test "$COUNT" -ge 74
          cat $(ls .lock-import/*.b64 | sort) | base64 -d | python3 -c "import sys,zlib; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))" > pnpm-lock.yaml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pnpm-lock.yaml')
          t=p.read_text()
          assert t.startswith('lockfileVersion')
          print('assembled', p.stat().st_size)
          PY
          rm -rf .lock-import
          rm -f .github/workflows/assemble-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Lisan al-Ghaib kit (part 15)"
          git push
