name: assemble-lockfile
on:
  push:
    paths:
      - '.lock-import/**'
      - '.github/workflows/assemble-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble pnpm-lock.yaml
        run: |
          set -euo pipefail
          cat .lock-import/part-*.txt > pnpm-lock.yaml
          rm -rf .lock-import
          rm -f .github/workflows/assemble-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Lisan al-Ghaib kit (part 15)"
          git push
